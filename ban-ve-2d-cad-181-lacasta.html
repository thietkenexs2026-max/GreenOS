<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hồ Sơ Bản Vẽ Kỹ Thuật 2D CAD — 181 LACASTA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    body {
      background: #e2e8f0;
      color: #0f172a;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: #0f172a;
      color: #ffffff;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.22);
    }
    .top-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.2px;
    }
    .top-title span.badge {
      background: #16a34a;
      color: #ffffff;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      padding: 7px 13px;
      border-radius: 7px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .btn:hover {
      background: #334155;
      color: #ffffff;
    }
    .btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }
    .btn.print-btn {
      background: #15803d;
      color: #ffffff;
      border-color: #22c55e;
    }
    .btn.print-btn:hover {
      background: #16a34a;
    }
    .sheets-container {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .sheet-card {
      width: 100%;
      max-width: 1680px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
      padding: 12px;
      overflow: hidden;
    }
    .sheet-card svg {
      width: 100%;
      height: auto;
      display: block;
    }
    @media print {
      @page {
        size: A3 landscape;
        margin: 6mm;
      }
      body {
        background: #ffffff !important;
      }
      .top-bar {
        display: none !important;
      }
      .sheets-container {
        padding: 0 !important;
        gap: 0 !important;
      }
      .sheet-card {
        max-width: none !important;
        width: 408mm !important;
        height: 285mm !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        padding: 0 !important;
        page-break-after: always;
        break-after: page;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .sheet-card:last-child {
        page-break-after: auto;
        break-after: auto;
      }
      .sheet-card svg {
        width: 100% !important;
        height: 100% !important;
      }
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <div class="top-title">
      <span>📐 HỒ SƠ BẢN VẼ KỸ THUẬT 2D CAD — 181 LACASTA</span>
      <span class="badge">TỶ LỆ 1:100 • CHUẨN A3</span>
    </div>
    <div class="controls">
      <button class="btn active" id="tab-both">📋 Xem Cả 2 Bản (01 + 02)</button>
      <button class="btn" id="tab-furn">🛒 Chỉ Bản 01: Có Đồ Đạc</button>
      <button class="btn" id="tab-empty">🏛️ Chỉ Bản 02: Không Đồ Đạc (Hiện Trạng)</button>
      <button class="btn" id="btn-theme">📄 Nền Trắng Hồ Sơ</button>
      <button class="btn print-btn" onclick="window.print()">🖨️ In / Xuất PDF (A3 Ngang)</button>
    </div>
  </header>

  <main class="sheets-container" id="sheets-root"></main>

  <svg id="svg-stage" style="display:none;"><g id="cad-pan-zoom"><g id="cad-content"></g></g></svg>

  <script>
    const S = {
      frontW: 5.00,
      frontL: 4.00,
      height: 2.80,
      uWcW: 0.90,
      uOppW: 0.30,
      uLen: 1.83,
      stepH: 0.15,
      rearL: 4.28,
      storeToStair: 2.03,
      stairW: 1.00,
      stairL: 1.30,
      rearW: 3.10
    };

    const SCALE = 88; // Generous scale (88px = 1.00m) so every label is spacious and crisp
    let isVertical = true;
    let show2DFurn = true;
    let isWhitePaper2D = true; // Default to clean White Engineering Dossier theme for maximum readability!
    const cadPanZoom = document.getElementById('cad-pan-zoom');
    const cadContent = document.getElementById('cad-content');
    const svgStage = document.getElementById('svg-stage');
    let zoom = 0.68, panX = 185, panY = 76;

    function applyTransform() {
      cadPanZoom.setAttribute('transform', `translate(${panX}, ${panY}) scale(${zoom})`);
    }

    // Standard ISO/TCVN Dimension Line:
    // Fixed signed normal so:
    // - For horizontal lines: offset < 0 is ALWAYS ABOVE (-Y), offset > 0 is ALWAYS BELOW (+Y).
    // - For vertical lines: offset < 0 is ALWAYS LEFT (-X, outside left wall), offset > 0 is ALWAYS RIGHT (+X, outside right wall).
    function drawDim(x1, y1, x2, y2, offset, labelText, color = '#0284c7', markerId = 'dim-arrow', isBig = false) {
      const dx = x2 - x1, dy = y2 - y1;
      const len = Math.hypot(dx, dy);
      if (len < 1) return '';
      const isVertLine = Math.abs(dy) > Math.abs(dx);
      const nx = isVertLine ? 1 : 0;
      const ny = isVertLine ? 0 : 1;
      const ox1 = x1 + nx * offset, oy1 = y1 + ny * offset;
      const ox2 = x2 + nx * offset, oy2 = y2 + ny * offset;
      const extOver = offset > 0 ? 6 : -6;
      const signOffset = offset >= 0 ? 1 : -1;
      const mx = (ox1 + ox2) / 2, my = (oy1 + oy2) / 2;
      const fontSize = isBig ? 10.8 : 9.5;
      const boxH = isBig ? 21 : 18;
      const boxW = Math.min(len - 4, Math.max(38, labelText.length * (isBig ? 6.5 : 5.8) + 12));
      const pillBg = isWhitePaper2D ? '#ffffff' : '#09101d';
      const rotAttr = isVertLine ? `transform="rotate(-90, ${mx}, ${my})"` : '';
      return `
        <g>
          <line x1="${x1 + nx * signOffset * 3}" y1="${y1 + ny * signOffset * 3}" x2="${ox1 + nx * extOver}" y2="${oy1 + ny * extOver}" stroke="${color}" stroke-width="1" stroke-opacity="0.55" />
          <line x1="${x2 + nx * signOffset * 3}" y1="${y2 + ny * signOffset * 3}" x2="${ox2 + nx * extOver}" y2="${oy2 + ny * extOver}" stroke="${color}" stroke-width="1" stroke-opacity="0.55" />
          <line x1="${ox1}" y1="${oy1}" x2="${ox2}" y2="${oy2}" stroke="${color}" stroke-width="${isBig ? 2.0 : 1.4}" marker-start="url(#${markerId})" marker-end="url(#${markerId})" />
          <g ${rotAttr}>
            <rect x="${mx - boxW / 2}" y="${my - boxH / 2}" width="${boxW}" height="${boxH}" rx="4" fill="${pillBg}" stroke="${color}" stroke-width="${isBig ? 1.5 : 1.1}" />
            <text x="${mx}" y="${my + 3.5}" fill="${color}" font-family="'JetBrains Mono', monospace" font-size="${fontSize}" font-weight="800" text-anchor="middle">${labelText}</text>
          </g>
        </g>
      `;
    }

    // Internal clearance / aisle dimension arrow inside the room:
    // NOTE: Keeps pill HORIZONTAL by default so short vertical gaps (like 0.38m = 33px or 0.60m = 52px)
    // hold a compact 15px-tall horizontal pill without EVER overflowing into shelves above/below!
    // Pass rotateVert = true ONLY for long vertical dimension lines (> 1.8m).
    function drawInlineClearance(x1, y1, x2, y2, labelText, color = '#c2410c', markerId = 'dim-arrow-amber', rotateVert = false) {
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      const boxW = Math.max(38, labelText.length * 5.8 + 10);
      const boxH = 15.5;
      const pillBg = isWhitePaper2D ? '#fffbeb' : '#09101d';
      const rotAttr = rotateVert ? `transform="rotate(-90, ${mx}, ${my})"` : '';
      return `
        <g>
          <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="1.4" stroke-dasharray="3,2" marker-start="url(#${markerId})" marker-end="url(#${markerId})" />
          <g ${rotAttr}>
            <rect x="${mx - boxW / 2}" y="${my - boxH / 2}" width="${boxW}" height="${boxH}" rx="3.5" fill="${pillBg}" stroke="${color}" stroke-width="1.1" />
            <text x="${mx}" y="${my + 3.1}" fill="${color}" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" text-anchor="middle">${labelText}</text>
          </g>
        </g>
      `;
    }

    function renderCAD() {
      const distFrontToStep = S.frontL + S.uLen;             // 5.83m
      const distStepToBack = S.rearL;                        // 4.28m
      const totalLengthM = distFrontToStep + distStepToBack; // 10.11m
      const storeSegmentM = S.rearL - S.storeToStair - S.stairL; // 0.95m

      const stairL_px = S.stairL * SCALE;
      const storeToStair_px = S.storeToStair * SCALE;
      const storeSeg_px = storeSegmentM * SCALE;
      const uLen_px = S.uLen * SCALE;
      const frontL_px = S.frontL * SCALE;

      const yBack = 0;
      const yStairBoxBot = stairL_px;                   // 1.30m from back (114.4px)
      const yStoreBot = yStairBoxBot + storeToStair_px; // 3.33m from back (293.0px)
      const yStep15 = yStoreBot + storeSeg_px;          // 4.28m from back (376.6px)
      const yFirstU = yStep15 + uLen_px;                // 6.11m from back (537.7px)
      const yFront = yFirstU + frontL_px;               // 10.11m from back (889.7px)

      const xLeft0 = 0;
      const xLeftWC = S.uWcW * SCALE;                   // 0.90m (79.2px)
      const xLeftStairBox = (S.uWcW + S.stairW) * SCALE;// 1.90m (167.2px)
      const xRightAfterU = (S.frontW - S.uOppW) * SCALE;// 4.70m (413.6px)
      const xRight0 = S.frontW * SCALE;                 // 5.00m (440.0px)

      const P = isWhitePaper2D ? {
        canvasBg: '#f1f5f9',
        sheetBg: '#ffffff',
        sheetBorder: '#cbd5e1',
        floorFill: '#fcfaf5',
        wallStroke: '#0f172a',
        textMain: '#0f172a',
        textMuted: '#475569',
        blue: '#0369a1',
        gold: '#b45309',
        green: '#15803d',
        rose: '#be123c',
        amber: '#c2410c',
        wcFill: '#ffe4e6',
        storeFill: '#dcfce7',
        stairFill: '#e0f2fe',
        uRightFill: '#fef3c7',
        tableBg: '#ffffff',
        tableHeaderBg: '#0f172a',
        rowEven: '#f8fafc',
        rowOdd: '#ffffff',
        rowBorder: '#cbd5e1'
      } : {
        canvasBg: '#070b12',
        sheetBg: '#0b1322',
        sheetBorder: '#1e293b',
        floorFill: '#141f31',
        wallStroke: '#f8fafc',
        textMain: '#f8fafc',
        textMuted: '#94a3b8',
        blue: '#38bdf8',
        gold: '#facc15',
        green: '#4ade80',
        rose: '#fb7185',
        amber: '#fb923c',
        wcFill: 'rgba(251, 113, 133, 0.22)',
        storeFill: 'rgba(74, 222, 128, 0.18)',
        stairFill: 'rgba(56, 189, 248, 0.22)',
        uRightFill: 'rgba(250, 204, 21, 0.18)',
        tableBg: '#0b1322',
        tableHeaderBg: '#1e293b',
        rowEven: 'rgba(30, 41, 59, 0.75)',
        rowOdd: 'rgba(15, 23, 42, 0.75)',
        rowBorder: 'rgba(148, 163, 184, 0.2)'
      };

      svgStage.style.background = P.canvasBg;

      let html = `
        <rect x="-135" y="-158" width="1730" height="${yFront + 295}" rx="12" fill="${P.sheetBg}" stroke="${P.sheetBorder}" stroke-width="2.5" />
        <!-- Top Sheet Banner Title (Cleanly above the top dimension chain with 35px breathing room) -->
        <rect x="-115" y="-142" width="1690" height="44" rx="7" fill="${P.tableHeaderBg}" />
        <text x="-95" y="-115" fill="#ffffff" font-size="14.5" font-weight="800">
          ${show2DFurn
            ? '📐 HỒ SƠ BẢN VẼ KỸ THUẬT 01/02: MẶT BẰNG BỐ TRÍ QUẦY KỆ, TỦ MÁT, TỦ ĐÁ & LỐI ĐI CHI TIẾT — 181 LACASTA'
            : '🏛️ HỒ SƠ BẢN VẼ KỸ THUẬT 02/02: MẶT BẰNG KHẢO SÁT HIỆN TRẠNG PHÒNG TRỐNG (KHÔNG ĐỒ ĐẠC) — 181 LACASTA'}
        </text>
        <text x="1555" y="-115" fill="#fde047" font-family="'JetBrains Mono'" font-size="11.5" font-weight="800" text-anchor="end">
          TỶ LỆ 1:100 • ĐƠN VỊ: MÉT (m) • CAO TRẦN: 2.80m
        </text>

        <!-- Outer Structural Lot Box (5.00m x 10.11m) -->
        <rect x="${xLeft0}" y="${yBack}" width="${xRight0}" height="${yFront - yBack}" fill="url(#wall-hatch)" opacity="0.22" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,4" />
      `;

      const polyPts = [
        `${xLeft0},${yFront}`, `${xLeft0},${yFirstU}`, `${xLeftWC},${yFirstU}`,
        `${xLeftWC},${yStairBoxBot}`, `${xLeftStairBox},${yStairBoxBot}`, `${xLeftStairBox},${yBack}`,
        `${xRight0},${yBack}`, `${xRight0},${yStep15}`, `${xRightAfterU},${yStep15}`,
        `${xRightAfterU},${yFirstU}`, `${xRight0},${yFirstU}`, `${xRight0},${yFront}`
      ].join(' ');

      html += `<polygon points="${polyPts}" fill="${P.floorFill}" />`;
      html += `<polygon points="${polyPts}" fill="url(#tile-grid-600)" />`;
      html += `<polygon points="${polyPts}" fill="none" stroke="${P.wallStroke}" stroke-width="4.5" stroke-linejoin="round" />`;

      // =====================================================================
      // ARCHITECTURAL ZONES (STRICTLY CALIBRATED TO FIT INSIDE EACH BOX)
      // =====================================================================
      html += `
        <!-- 1. Khối WC Gầm Cầu Thang (79px x 161px) -->
        <rect x="${xLeft0}" y="${yStep15}" width="${xLeftWC}" height="${uLen_px}" fill="${P.wcFill}" stroke="${P.rose}" stroke-width="2.2" />
        <text x="${xLeftWC / 2}" y="${(yFirstU + yStep15) / 2 - 14}" fill="${P.rose}" font-size="8.6" font-weight="800" text-anchor="middle">WC GẦM</text>
        <text x="${xLeftWC / 2}" y="${(yFirstU + yStep15) / 2}" fill="${P.textMain}" font-family="'JetBrains Mono'" font-size="8" font-weight="800" text-anchor="middle">0.90×1.83m</text>
        <text x="${xLeftWC / 2}" y="${(yFirstU + yStep15) / 2 + 14}" fill="${P.rose}" font-family="'JetBrains Mono'" font-size="7.4" font-weight="800" text-anchor="middle">Cửa 0.62m ▶</text>
        <line x1="${xLeftWC}" y1="${yStep15 + 0.10 * SCALE}" x2="${xLeftWC}" y2="${yStep15 + 0.72 * SCALE}" stroke="${P.rose}" stroke-width="5.5" />

        <!-- 2. Nhà Kho Gầm Cầu Thang (79px x 83.6px) -->
        <rect x="${xLeft0}" y="${yStoreBot}" width="${xLeftWC}" height="${storeSeg_px}" fill="${P.storeFill}" stroke="${P.green}" stroke-width="2.2" />
        <text x="${xLeftWC / 2}" y="${(yStep15 + yStoreBot) / 2 - 11}" fill="${P.green}" font-size="8.4" font-weight="800" text-anchor="middle">KHO GẦM</text>
        <text x="${xLeftWC / 2}" y="${(yStep15 + yStoreBot) / 2 + 2}" fill="${P.textMain}" font-family="'JetBrains Mono'" font-size="8" font-weight="800" text-anchor="middle">0.90×0.95m</text>
        <text x="${xLeftWC / 2}" y="${(yStep15 + yStoreBot) / 2 + 14}" fill="${P.green}" font-family="'JetBrains Mono'" font-size="7.4" font-weight="800" text-anchor="middle">Cửa 0.78m ▶</text>
        <line x1="${xLeftWC}" y1="${yStep15 - 0.12 * SCALE}" x2="${xLeftWC}" y2="${yStep15 - 0.90 * SCALE}" stroke="${P.green}" stroke-width="5.5" />

        <!-- 3. Vách Kính Cầu Thang 4 Ô (79px x 178.6px) -->
        <rect x="${xLeft0}" y="${yStairBoxBot}" width="${xLeftWC}" height="${storeToStair_px}" fill="${isWhitePaper2D ? '#f1f5f9' : 'rgba(148,163,184,0.14)'}" stroke="#64748b" stroke-width="2" stroke-dasharray="5,3" />
        <text x="${xLeftWC / 2}" y="${(yStoreBot + yStairBoxBot) / 2 - 12}" fill="${P.textMain}" font-size="8.2" font-weight="800" text-anchor="middle">VÁCH KÍNH</text>
        <text x="${xLeftWC / 2}" y="${(yStoreBot + yStairBoxBot) / 2 + 1}" fill="${P.textMain}" font-size="8.2" font-weight="800" text-anchor="middle">CẦU THANG</text>
        <text x="${xLeftWC / 2}" y="${(yStoreBot + yStairBoxBot) / 2 + 14}" fill="${P.blue}" font-family="'JetBrains Mono'" font-size="8" font-weight="800" text-anchor="middle">0.90×2.03m</text>

        <!-- 4. Hộp Kính Cầu Thang Cuối Nhà (167px x 114px) -->
        <rect x="${xLeft0}" y="${yBack}" width="${xLeftStairBox}" height="${stairL_px}" fill="${P.stairFill}" stroke="${P.blue}" stroke-width="2.8" />
        <text x="${xLeftStairBox / 2}" y="${stairL_px / 2 - 12}" fill="${P.blue}" font-size="9.2" font-weight="800" text-anchor="middle">HỘP KÍNH CẦU THANG</text>
        <text x="${xLeftStairBox / 2}" y="${stairL_px / 2 + 2}" fill="${P.textMain}" font-family="'JetBrains Mono'" font-size="8.5" font-weight="800" text-anchor="middle">Hộp: 1.00m × 1.30m</text>
        <text x="${xLeftStairBox / 2}" y="${stairL_px / 2 + 15}" fill="${P.textMuted}" font-family="'JetBrains Mono'" font-size="7.6" font-weight="700" text-anchor="middle">(Tổng ngang: 1.90m)</text>

        <!-- 5. Khối U Tường Phải (CHỈ NẰM TRÊN BẬC: 0.30m x 1.83m = 26.4px x 161px; xuống bậc được +30cm mở ra sát tường phải 5.00m!) -->
        <rect x="${xRightAfterU}" y="${yStep15}" width="${S.uOppW * SCALE}" height="${uLen_px}" fill="${P.uRightFill}" stroke="${P.gold}" stroke-width="2.2" stroke-dasharray="5,3" />
        <text x="${xRightAfterU + 0.15 * SCALE}" y="${(yFirstU + yStep15) / 2}" fill="${P.gold}" font-family="'JetBrains Mono'" font-size="7.8" font-weight="800" text-anchor="middle" transform="rotate(-90, ${xRightAfterU + 0.15 * SCALE}, ${(yFirstU + yStep15) / 2})">KHỐI U: 0.30×1.83m</text>

        <!-- 6. Bậc Hạ Cốt Sàn -15cm (Tại mốc Z = 5.83m) + Hộp Ống Kỹ Thuật 10cm Dưới Bậc (Chạy suốt 4.10m từ vách WC tới tường phải 5.00m) -->
        <line x1="${xLeftWC}" y1="${yStep15}" x2="${xRight0}" y2="${yStep15}" stroke="${P.gold}" stroke-width="3" stroke-dasharray="8,4" />
        <rect x="${xLeftWC}" y="${yStep15 - 0.10 * SCALE}" width="${xRight0 - xLeftWC}" height="${0.10 * SCALE}" fill="${P.wcFill}" stroke="${P.rose}" stroke-width="1.2" stroke-dasharray="3,2" />

        <!-- 7. Cửa Kính Chính Mặt Tiền (Rộng 3.40m) & Cửa Cuốn Cổng Sau (Rộng 3.10m / 2.80m) -->
        <line x1="${0.80 * SCALE}" y1="${yFront}" x2="${4.20 * SCALE}" y2="${yFront}" stroke="${P.blue}" stroke-width="6.5" />
        <line x1="${xLeftStairBox}" y1="${yBack}" x2="${xRight0}" y2="${yBack}" stroke="${P.green}" stroke-width="6.5" />
      `;

      // =====================================================================
      // CONTENT INSIDE THE ROOM: VERSION 1 (FURNISHED) vs VERSION 2 (EMPTY ROOM)
      // =====================================================================
      if (show2DFurn) {
        const is1X = 1.85 * SCALE; // X = 1.85m .. 3.35m (Rộng 1.50m -> Lối đi trái 0.95m & Lối đi phải 0.95m cân đối 100%!)
        const is2X = 2.20 * SCALE; // X = 2.20m .. 3.35m (Rộng 1.15m -> Lối đi trái với Kệ WC 2B = 0.95m & Lối đi phải 0.95m!)
        const is3X = 2.38 * SCALE; // X = 2.38m .. 3.48m (Rộng 1.10m nhờ xuống bậc +30cm -> Lối đi trái 0.98m & Lối đi phải 0.97m!)

        const boxFillAmber = isWhitePaper2D ? '#fef3c7' : 'rgba(234, 179, 8, 0.32)';
        const boxFillGreen = isWhitePaper2D ? '#dcfce7' : 'rgba(34, 197, 94, 0.30)';
        const boxFillIce   = isWhitePaper2D ? '#e0f2fe' : 'rgba(2, 132, 199, 0.38)';
        const boxFillMeat  = isWhitePaper2D ? '#ffe4e6' : 'rgba(239, 68, 68, 0.32)';
        const boxFillWood  = isWhitePaper2D ? '#ffedd5' : 'rgba(217, 119, 6, 0.35)';

        html += `
          <!-- 1. QUẦY THU NGÂN CHỮ L KÉO DÀI SÁT CỬA CHÍNH + GHẾ NV + KỆ 3 TẦNG MẶT NGOÀI (Mốc Z: 0.04m .. 1.54m, Dài 1.50m, X: 3.62m .. 5.00m) -->
          <!-- Khoảng ghế ngồi NV bên trong áp tường phải (57px x 96.8px) -->
          <rect x="${xRight0 - 0.68 * SCALE}" y="${yFront - 1.54 * SCALE}" width="${0.65 * SCALE}" height="${1.10 * SCALE}" rx="3" fill="${boxFillIce}" stroke="${P.blue}" stroke-width="1.3" stroke-dasharray="3,2" />

        <g>
          <rect x="${tblX}" y="${yBack}" width="${tblW}" height="${boxAHeight}" rx="8" fill="${P.tableBg}" stroke="${P.blue}" stroke-width="2" />
          <rect x="${tblX}" y="${yBack}" width="${tblW}" height="38" rx="8" fill="${P.tableHeaderBg}" />
          <text x="${tblX + 18}" y="${yBack + 24}" fill="#ffffff" font-size="12.5" font-weight="800">🏛️ BẢNG A — KÍCH THƯỚC CHI TIẾT CÁC VỊ TRÍ KIẾN TRÚC, CỬA &amp; LỌT LÒNG TRONG PHÒNG (181 LACASTA)</text>
          <text x="${tblX + 20}" y="${yBack + 55}" fill="${P.textMuted}" font-size="10" font-weight="800">VỊ TRÍ KIẾN TRÚC / KHU VỰC TRONG PHÒNG</text>
          <text x="${tblX + 295}" y="${yBack + 55}" fill="${P.textMuted}" font-size="10" font-weight="800">KÍCH THƯỚC CHUẨN</text>
          <text x="${tblX + 485}" y="${yBack + 55}" fill="${P.textMuted}" font-size="10" font-weight="800">TỌA ĐỘ MỐC Z (TỪ CỬA CHÍNH) &amp; THÔNG SỐ CHI TIẾT</text>
          ${roomRowsSvg}
        </g>

        <!-- TABLE B: EQUIPMENT DIMENSIONS (VERSION 1) OR EMPTY ROOM AREA BREAKDOWN (VERSION 2) -->
        <g>
          <rect x="${tblX}" y="${tblBY}" width="${tblW}" height="${boxBHeight}" rx="8" fill="${P.tableBg}" stroke="${P.green}" stroke-width="2" />
          <rect x="${tblX}" y="${tblBY}" width="${tblW}" height="38" rx="8" fill="${P.tableHeaderBg}" />
          <text x="${tblX + 18}" y="${tblBY + 24}" fill="#fde047" font-size="12.5" font-weight="800">${titleB}</text>
          <text x="${tblX + 20}" y="${tblBY + 55}" fill="${P.textMuted}" font-size="10" font-weight="800">${show2DFurn ? 'STT &amp; TÊN ĐỒ ĐẠC / QUẦY KỆ / TỦ LẠNH' : 'PHÂN KHU KHÔNG GIAN &amp; HẠ TẦNG'}</text>
          <text x="${tblX + 295}" y="${tblBY + 55}" fill="${P.textMuted}" font-size="10" font-weight="800">${show2DFurn ? 'KÍCH THƯỚC (DÀI × RỘNG × CAO)' : 'KÍCH THƯỚC &amp; DIỆN TÍCH'}</text>
          <text x="${tblX + 485}" y="${tblBY + 55}" fill="${P.textMuted}" font-size="10" font-weight="800">${show2DFurn ? 'VỊ TRÍ ĐẶT TRONG PHÒNG &amp; KHOẢNG CÁCH LỐI ĐI' : 'ĐẶC ĐIỂM KỸ THUẬT HIỆN TRẠNG'}</text>
          ${rowsBSvg}
        </g>
      `;

      cadContent.setAttribute('transform', isVertical ? '' : `rotate(90, ${xRight0 / 2}, ${yFront / 2})`);
      cadContent.innerHTML = html;
      applyTransform();
    }

    

    let currentMode = 'both';
    const sheetsRoot = document.getElementById('sheets-root');

    function renderSheets() {
      sheetsRoot.innerHTML = '';
      const list = currentMode === 'both' ? [true, false] : (currentMode === 'furn' ? [true] : [false]);
      list.forEach((furn) => {
        show2DFurn = furn;
        renderCAD();
        const card = document.createElement('div');
        card.className = 'sheet-card';
        card.style.background = isWhitePaper2D ? '#ffffff' : '#0b1322';
        card.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-145 -168 1750 1195" preserveAspectRatio="xMidYMid meet"><defs>
          <marker id="dim-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0284c7" />
          </marker>
          <marker id="dim-arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#b45309" />
          </marker>
          <marker id="dim-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#15803d" />
          </marker>
          <marker id="dim-arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
            <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#be123c" />
          </marker>
          <marker id="dim-arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
            <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#c2410c" />
          </marker>
          <pattern id="tile-grid-600" width="52.8" height="52.8" patternUnits="userSpaceOnUse">
            <path d="M 52.8 0 L 0 0 0 52.8" fill="none" stroke="rgba(100, 116, 139, 0.22)" stroke-width="1" />
          </pattern>
          <pattern id="wall-hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
            <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.5" />
          </pattern>
          <pattern id="wc-hatch" width="10" height="10" patternTransform="rotate(-45 0 0)" patternUnits="userSpaceOnUse">
            <line x1="0" y1="0" x2="0" y2="10" stroke="rgba(225, 29, 72, 0.25)" stroke-width="2" />
          </pattern>
        </defs><g>${cadContent.innerHTML}</g></svg>`;
        sheetsRoot.appendChild(card);
      });
    }

    function setTab(mode, btnId) {
      currentMode = mode;
      ['tab-both', 'tab-furn', 'tab-empty'].forEach((id) => {
        document.getElementById(id).classList.toggle('active', id === btnId);
      });
      renderSheets();
    }

    document.getElementById('tab-both').addEventListener('click', () => setTab('both', 'tab-both'));
    document.getElementById('tab-furn').addEventListener('click', () => setTab('furn', 'tab-furn'));
    document.getElementById('tab-empty').addEventListener('click', () => setTab('empty', 'tab-empty'));

    document.getElementById('btn-theme').addEventListener('click', (e) => {
      isWhitePaper2D = !isWhitePaper2D;
      e.currentTarget.textContent = isWhitePaper2D ? '📄 Nền Trắng Hồ Sơ' : '🌙 Nền Tối Blueprint';
      document.body.style.background = isWhitePaper2D ? '#e2e8f0' : '#050811';
      renderSheets();
    });

    renderSheets();
  </script>
</body>
</html>
